version: 1

# This is a schema/example only. Real maps and mission files live in the
# capability_mission_scenarios repository.
map:
  directory: /path/to/map_bundle
  allow_unknown: false
  inflation_radius_m: 0.0
output_directory: ../output/example
planner:
  coordinate_conflicts: true
  objective: {maximum_load_weight: 1.0, total_load_weight: 0.1}
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.5
robots:
  - id: robot_a
    start: {map_id: map_000, grid: [10, 10]}
    capabilities: [camera]
    return_home: true
tasks:
  - id: task_1
    location: {map_id: map_000, grid: [20, 20]}
    requirements: [camera]
    category: gimbal_photo
    service_seconds: 2
