version: 1

# Paths are resolved relative to this configuration file.
map:
  directory: ../tmp/栅格示例/2
  allow_unknown: false
  inflation_radius_m: 0.0

output_directory: ../output/offline_multi_map

planner:
  coordinate_conflicts: true
  objective:
    maximum_load_weight: 1.0
    total_load_weight: 0.1
  traversal:
    time_step_seconds: 0.1
    nominal_speed_mps: 0.5
    default_transition_seconds: 5.0
    map_switch_seconds: 2.0
    transition_seconds:
      stairs: 8.0
      elevator: 15.0
    transition_requirements:
      stairs: [stairs]
      elevator: []

export:
  path_thickness: 3
  draw_grid: false

robots:
  - id: a
    start: {map_id: map_000, grid: [409, 392]}
    capabilities: [fire, camera, stairs]
    return_home: true
  - id: b
    start: {map_id: map_000, grid: [352, 636]}
    capabilities: [camera, thermal, stairs]
    return_home: true
  - id: c
    start: {map_id: map_000, grid: [576, 489]}
    capabilities: [fire, camera, thermal, stairs]
    return_home: true

tasks:
  - id: T1-photo
    location: {map_id: map_000, grid: [278, 481]}
    requirements: [camera]
    category: gimbal_photo
    service_seconds: 2
    high_priority: true
  - id: T2-fire
    location: {map_id: map_000, grid: [278, 481]}
    requirements: [fire]
    category: fire_suppression
    service_seconds: 4
  - id: T3-thermal
    location: {map_id: map_003, grid: [358, 336]}
    requirements: [thermal]
    category: thermal_inspection
    service_seconds: 3
  - id: T4-photo
    location: {map_id: map_003, grid: [186, 364]}
    requirements: [camera]
    category: gimbal_photo
    service_seconds: 2
  - id: T5-fire
    location: {map_id: map_006, grid: [203, 449]}
    requirements: [fire]
    category: fire_suppression
    service_seconds: 4
    high_priority: true
  - id: T6-fire-photo
    location: {map_id: map_006, grid: [419, 363]}
    requirements: [fire, camera]
    category: fire_documentation
    service_seconds: 5
